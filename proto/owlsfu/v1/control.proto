syntax = "proto3";

package owlsfu.v1;

import "owlsfu/v1/common.proto";

// 控制通道（03 §5：gRPC over mTLS，SFU 主动外连，一条双向流）。
// 媒体永不走此通道。所有 Server→SFU 指令携带 command_id，SFU 幂等执行并 Ack。
service ControlService {
  rpc Channel(stream NodeMessage) returns (stream ServerMessage);
}

// ---------- SFU → Server ----------

message NodeMessage {
  oneof payload {
    Register register = 1;
    Heartbeat heartbeat = 2;
    RoomEvent room_event = 3;
    EdgeStatus edge_status = 4;
    CommandAck command_ack = 5;
    DrainRequest drain_request = 6;
  }
}

// 节点主动请求排空（09 §3.5 / 15 BK：SIGTERM 时 SFU 上报，由 Server
// 编排热迁移；判死/编排权威仍在 Server，本消息只是意愿信号）。
message DrainRequest {
  string reason = 1; // 如 "sigterm"
}

message Register {
  string node_version = 1;
  NodeAdvertise advertise = 2;
  NodeCapacity capacity = 3;
}

// 节点自报的接入端点（下发给客户端/级联对端用）。
message NodeAdvertise {
  string wss_url = 1;          // 客户端信令端点，如 wss://n1.sfu.example.com
  uint32 media_udp_port = 2;   // UDPMux 端口（默认 3478）
  repeated string media_ips = 3; // 媒体 IP（公网/内网）
  string cascade_endpoint = 4; // 级联 mTLS 信令端点 host:port
}

message Heartbeat {
  NodeCapacity capacity = 1;
  int64 unix_ms = 2;
}

message RoomEvent {
  string room_id = 1; // logical_room_id
  EventType type = 2;
  string session_id = 3; // voice_session_id (sid)
  string user_id = 4;
  string detail = 5;
  int64 unix_ms = 6;

  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    EVENT_TYPE_PARTICIPANT_JOINED = 1;    // 媒体已连通（05 步骤 12–13）
    EVENT_TYPE_PARTICIPANT_LEFT = 2;      // 主动离开或 ICE 超时（幂等）
    EVENT_TYPE_PARTICIPANT_ICE_FAILED = 3;
    EVENT_TYPE_SCREEN_TRACK_ACTIVE = 4;   // 预留
    EVENT_TYPE_SCREEN_TRACK_ENDED = 5;    // 预留
  }
}

// 级联边状态（08 §6.1；M3 使用，M1 预留）。
message EdgeStatus {
  string room_id = 1;
  uint64 epoch = 2;
  string parent_node_id = 3;
  string child_node_id = 4;
  State state = 5;
  double rtt_ms = 6;
  double loss_pct = 7;

  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_EDGE_UP = 1;
    STATE_EDGE_DOWN = 2;
  }
}

message CommandAck {
  string command_id = 1;
  bool ok = 2;
  string error_code = 3;
  string error_message = 4;
}

// ---------- Server → SFU ----------

message ServerMessage {
  oneof payload {
    RegisterAck register_ack = 1;
    Command command = 2;
  }
}

message RegisterAck {
  string node_id = 1;
  uint32 heartbeat_interval_ms = 2; // 定稿 5000（15 BI.1）
  repeated MediaTokenKey media_token_keys = 3;
  // 音频审计上传（adminpresence）：主节点 /audit-api/records 地址与共享密钥。
  // SFU 本地未配置 audit_ingest_* 时采用此处下发值；二者皆空则仅本地落盘不上传。
  string audit_ingest_url = 4;
  string audit_ingest_token = 5;
}

message Command {
  string command_id = 1; // 幂等键（重放去重窗口）
  oneof payload {
    EnsureLogicalRoom ensure_logical_room = 2;
    CloseLogicalRoom close_logical_room = 3;
    DisconnectUser disconnect_user = 4;
    RevokeSession revoke_session = 5;
    UpdateParticipantCaps update_participant_caps = 6;
    SetAnchorLease set_anchor_lease = 7;
    SetCascadeEdges set_cascade_edges = 8;
    MigrateParticipants migrate_participants = 9;
    Drain drain = 10;
  }
}

message EnsureLogicalRoom {
  string room_id = 1;
}

message CloseLogicalRoom {
  string room_id = 1;
}

message DisconnectUser {
  string room_id = 1;
  string user_id = 2;
  string session_id = 3; // 可选；为空则断该 room 内该 user 全部会话
  Reason reason = 4;

  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_ADMIN = 1;
    REASON_PERMISSION = 2;
    REASON_LEAVE = 3;
    REASON_MIGRATION = 4;
    REASON_RESTRICTION = 5;
  }
}

message RevokeSession {
  string session_id = 1;
  string jti = 2; // 可选：吊销特定 token
}

message UpdateParticipantCaps {
  string room_id = 1;
  string session_id = 2;
  repeated Cap caps = 3; // 全量替换
}

// ---------- 级联与迁移（M3/M4 使用，协议先定）----------

message SetAnchorLease {
  string room_id = 1;
  string anchor_node_id = 2;
  uint64 epoch = 3;
  int64 lease_expire_unix_ms = 4;
}

message SetCascadeEdges {
  string room_id = 1;
  uint64 epoch = 2; // 整体切换；旧 epoch 边作废
  repeated CascadeEdge edges = 3;
}

message CascadeEdge {
  string parent_node_id = 1;
  string child_node_id = 2;
  string parent_cascade_endpoint = 3; // child 主动连 parent
  string cascade_token = 4;           // Server 签发，绑定 room+epoch+edge
}

message MigrateParticipants {
  string migration_id = 1;
  string room_id = 2;
  repeated string session_ids = 3;
  string to_node_id = 4;
  // phase 迁出两段语义（09 §5.1 + M4 实装）：
  //   MARK    = CONNECT 阶段发给源节点：标记 sid 处于迁出中（继续服务到 CUTOVER）；
  //   EXECUTE = CLEANUP 阶段发给源节点：RemoveParticipant（closed 码 MIGRATED）。
  // 未指定按 EXECUTE 处理（对旧版指令向后兼容）。
  Phase phase = 5;

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_MARK = 1;
    PHASE_EXECUTE = 2;
  }
}

message Drain {
  int64 deadline_unix_ms = 1; // 09 I.6：默认 60s 后硬迁
  // cancel = true 表示取消排空（admin undrain）：节点恢复接受新会话。
  bool cancel = 2;
}
