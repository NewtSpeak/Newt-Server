# Newt-Server 发布：嵌入 SPA 的多平台二进制 → 本仓 Release + 同步到 NewtSpeak/NewtSpeak
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v 前缀，如 0.1.0）"
        required: true
        type: string
      extra_notes:
        description: "附加到 Release 说明的额外备注（可选）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  CGO_ENABLED: "0"
  RELEASE_HUB_REPO: NewtSpeak/NewtSpeak

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Compute version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "empty version" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  prepare-frontend:
    name: Build frontend for embed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install & build SPA
        working-directory: frontend
        run: |
          bun install --frozen-lockfile || bun install
          bun run build

      - name: Stage embed dist
        run: |
          rm -rf backend/internal/web/dist/assets \
                 backend/internal/web/dist/index.html \
                 backend/internal/web/dist/favicon.ico
          mkdir -p backend/internal/web/dist
          cp -R frontend/build/client/. backend/internal/web/dist/
          test -f backend/internal/web/dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: embed-frontend-dist
          path: backend/internal/web/dist
          retention-days: 3

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [resolve-version, prepare-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: embed-frontend-dist
          path: backend/internal/web/dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build newt-server
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          test -f internal/web/dist/index.html
          mkdir -p dist
          OUT="dist/newt-server-${VERSION}-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w" -o "${OUT}" ./cmd/server
          sha256sum "${OUT}" | tee "${OUT}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: newt-server-${{ needs.resolve-version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: backend/dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release + Hub sync
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: newt-server-*
          merge-multiple: true

      - name: Prepare checksums
        working-directory: release-assets
        run: |
          ls -lah
          {
            if ls *.sha256 >/dev/null 2>&1; then cat *.sha256
            else sha256sum newt-server-*
            fi
          } > "SHA256SUMS-newt-server-${{ needs.resolve-version.outputs.version }}.txt"
          cat "SHA256SUMS-newt-server-${{ needs.resolve-version.outputs.version }}.txt"

      - name: Write extra notes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extra_notes != '' }}
        run: |
          printf '%s\n' "${{ inputs.extra_notes }}" > EXTRA_NOTES.md

      - name: Generate release notes
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/ci/generate-release-notes.sh
          EXTRA=""
          if [ -f EXTRA_NOTES.md ]; then EXTRA=EXTRA_NOTES.md; fi
          scripts/ci/generate-release-notes.sh "Newt-Server" "$EXTRA" | tee RELEASE_BODY.md

      - name: Create own-repo Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: Newt-Server ${{ needs.resolve-version.outputs.tag }}
          body_path: RELEASE_BODY.md
          files: |
            release-assets/newt-server-*
            release-assets/SHA256SUMS-newt-server-*
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to NewtSpeak/NewtSpeak hub
        env:
          RELEASE_HUB_TOKEN: ${{ secrets.RELEASE_HUB_TOKEN }}
          RELEASE_HUB_REPO: ${{ env.RELEASE_HUB_REPO }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          COMPONENT_KEY: Newt-Server
          COMPONENT_TITLE: Newt-Server（控制面）
          RELEASE_BODY_PATH: RELEASE_BODY.md
          ASSET_GLOBS: "release-assets/newt-server-* release-assets/SHA256SUMS-newt-server-*"
        run: |
          chmod +x scripts/ci/sync-release-hub.sh
          scripts/ci/sync-release-hub.sh
